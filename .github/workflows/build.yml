name: Build & Release AntiGem Voice APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release APKs with Voice Support
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Parse version.json
        id: version
        run: |
          VERSION_NAME=$(python3 -c "import json; print(json.load(open('version.json')).get('version_name', '1.0.0'))" 2>/dev/null || echo "1.0.0")
          VERSION_CODE=$(python3 -c "import json; print(json.load(open('version.json')).get('version_code', 1))" 2>/dev/null || echo "1")
          echo "tag=v${VERSION_NAME}-voice" >> $GITHUB_OUTPUT
          echo "name=AntiGem Voice v${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Setup Keystore
        run: |
          mkdir -p app
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
          elif [ ! -f app/release.jks ]; then
            keytool -genkey -v -keystore app/release.jks \
              -storepass 123456 \
              -alias antigem \
              -keypass 123456 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AntiGem,O=AntiGem,C=US"
          fi

      - name: Build Release APKs
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-Voice-APKs
          path: output/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: "AntiGem with Built-in Read Aloud (Speaker) button on AI responses using on-device Google Neural Speech Services."
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
